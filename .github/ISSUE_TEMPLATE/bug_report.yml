name: Bug Report
description: Report a reproducible problem in Keyframe Character Studio
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a reproducible problem. Do not include secrets or private project files.
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Which commit, branch, or release did you test?
      placeholder: "e.g. 3e650ce or feat/v6-ui-redesign"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and browser
      placeholder: "e.g. Windows 11, Chromium 140"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence of actions.
      placeholder: |
        1. Start KCS with npm run dev
        2. Import or create a project
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: project
    attributes:
      label: Fixture or supporting evidence
      description: Provide a safe fixture, console output, or screenshot when useful. Remove personal or confidential data.
    validations:
      required: false
