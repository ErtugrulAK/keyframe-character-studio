name: CI Pipeline

on:
  push:
    branches: [ main, ui, timeline, renderer, animation, backend, infrastructure ]
  pull_request:
    branches: [ main, ui, timeline, renderer, animation, backend, infrastructure ]

jobs:
  validate:
    name: Build, Lint & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Static Analysis & Linting
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Unit & Integration Tests (Vitest)
        run: npx vitest run
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Run Production Bundle Build
        run: npm run build
