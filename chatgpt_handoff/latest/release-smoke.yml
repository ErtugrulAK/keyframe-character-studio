name: Release Smoke Gate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Full commit SHA to validate'
        required: true
        type: string
permissions:
  contents: read

jobs:
  release-smoke:
    name: Chromium OGraf Release Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1

      - name: Verify candidate SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Release Smoke Gate
        run: npm run qa:release
